<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glean Chat</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    glean-helper {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <glean-helper app-id="gleaninside"></glean-helper>
  <script type="module" src="/widget/index.ts"></script>
  <script>
    function setupWidget() {
      const el = document.querySelector('glean-helper');
      if (!el || !el.shadowRoot) { requestAnimationFrame(setupWidget); return; }

      // Override shadow DOM styles for tight WebView2 viewport
      const sheet = new CSSStyleSheet();
      sheet.replaceSync(`
        .root {
          position: relative !important;
          width: 100% !important;
          height: 100% !important;
        }
        .launcher {
          position: absolute !important;
          right: auto !important;
          bottom: auto !important;
          left: 50% !important;
          top: 50% !important;
          transform: translate(-50%, -50%) !important;
        }
        .panel {
          position: absolute !important;
          inset: 0 !important;
          width: auto !important;
          height: auto !important;
          border-radius: 0 !important;
        }
      `);
      el.shadowRoot.adoptedStyleSheets = [...el.shadowRoot.adoptedStyleSheets, sheet];

      // Watch for open/close and notify C# to resize the viewport
      let lastOpen = null;
      function check() {
        const panel = el.shadowRoot.querySelector('.panel');
        const isOpen = panel !== null;
        if (isOpen !== lastOpen) {
          lastOpen = isOpen;
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({
              type: 'widget-state',
              open: isOpen
            }));
          }
        }
      }

      const observer = new MutationObserver(check);
      observer.observe(el.shadowRoot, { childList: true, subtree: true });
      check();
    }
    requestAnimationFrame(setupWidget);
  </script>
</body>
</html>
