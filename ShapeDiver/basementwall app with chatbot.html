<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Configurator</title>

  <!-- 1. Load the Glean SDK -->
  <script defer src="https://app.glean.com/embedded-search-latest.min.js"></script>

  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: 100vh;
    }
    #shapediver-frame { width: 100%; height: 100%; border: 0; }
    #glean-app { border-left: 1px solid #e5e5e5; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 60vh 40vh; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <iframe
      id="shapediver-frame"
      src="https://tt-acm.github.io/CORE.Iframe.Wrapper/?slug=basement-wall-calculator"
      allow="fullscreen; xr-spatial-tracking"
    ></iframe>

    <!-- 2. Entry point -->
    <div id="glean-app" style="position: relative; display: block; height: 100%; width: 100%;"></div>
  </div>

  <!-- 3. Render the agent -->
  <script>
    document.addEventListener('DOMContentLoaded', () => GleanWebSDK.renderChat(document.getElementById('glean-app'), { agentId: "42349c7312dd4630aae2c75daa64803b" }))
  </script>
</body>
</html>
